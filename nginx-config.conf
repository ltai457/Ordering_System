server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # API Backend - Proxy to .NET app running on port 8080
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger {
        proxy_pass http://localhost:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Staff Dashboard - React SPA
    location /staff {
        alias /var/www/staff-dashboard;
        try_files $uri $uri/ /staff/index.html =404;
        index index.html;

        # Handle React Router - all /staff/* routes should serve index.html
        location ~ ^/staff/(.*)$ {
            alias /var/www/staff-dashboard;
            try_files /$1 /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Expires 0;
        }
    }

    # Customer App - React SPA (root path)
    location / {
        root /var/www/customer-app;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
    }
}
